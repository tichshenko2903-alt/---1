<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🖥️ СОБЕРИ ПК | Пазл-Челлендж</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;600;700&display=swap');
  
  * { margin: 0; padding: 0; box-sizing: border-box; }
  
  body {
    font-family: 'Rajdhani', sans-serif;
    background: linear-gradient(135deg, #0a0e27 0%, #1a1f4e 50%, #2d1b69 100%);
    min-height: 100vh;
    color: #fff;
    overflow-x: hidden;
    padding: 20px;
  }
  
  .container {
    max-width: 1200px;
    margin: 0 auto;
  }
  
  /* HEADER */
  .header {
    text-align: center;
    margin-bottom: 30px;
  }
  
  .title {
    font-family: 'Orbitron', sans-serif;
    font-size: clamp(2rem, 6vw, 4rem);
    font-weight: 900;
    background: linear-gradient(90deg, #00f0ff, #ff00e5);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 10px;
    text-shadow: 0 0 30px rgba(0,240,255,0.5);
  }
  
  .subtitle {
    font-size: 1.3rem;
    color: #b8bcff;
    letter-spacing: 0.2em;
  }
  
  /* STATS BAR */
  .stats-bar {
    display: flex;
    justify-content: center;
    gap: 20px;
    margin-bottom: 30px;
    flex-wrap: wrap;
  }
  
  .stat-card {
    background: rgba(0,240,255,0.1);
    border: 2px solid #00f0ff;
    border-radius: 15px;
    padding: 15px 30px;
    min-width: 150px;
    text-align: center;
    backdrop-filter: blur(10px);
  }
  
  .stat-label {
    font-size: 0.9rem;
    color: #b8bcff;
    text-transform: uppercase;
    letter-spacing: 0.1em;
  }
  
  .stat-value {
    font-family: 'Orbitron', sans-serif;
    font-size: 2rem;
    font-weight: 900;
    color: #00f0ff;
    margin-top: 5px;
  }
  
  .stat-value.timer { color: #ff00e5; }
  .stat-value.moves { color: #ffd700; }
  
  /* GAME AREA */
  .game-area {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 30px;
    margin-bottom: 30px;
  }
  
  @media (max-width: 900px) {
    .game-area { grid-template-columns: 1fr; }
  }
  
  .panel {
    background: rgba(255,255,255,0.05);
    border: 2px solid rgba(255,255,255,0.1);
    border-radius: 20px;
    padding: 25px;
    backdrop-filter: blur(10px);
  }
  
  .panel-title {
    font-family: 'Orbitron', sans-serif;
    font-size: 1.3rem;
    color: #00f0ff;
    margin-bottom: 20px;
    text-align: center;
    text-transform: uppercase;
    letter-spacing: 0.1em;
  }
  
  /* PUZZLE GRID */
  .puzzle-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    aspect-ratio: 1;
    max-width: 400px;
    margin: 0 auto;
  }
  
  .puzzle-cell {
    aspect-ratio: 1;
    background: rgba(0,0,0,0.3);
    border: 2px dashed rgba(255,255,255,0.2);
    border-radius: 10px;
    cursor: pointer;
    transition: all 0.3s;
    position: relative;
    overflow: hidden;
  }
  
  .puzzle-cell:hover {
    border-color: #00f0ff;
    box-shadow: 0 0 20px rgba(0,240,255,0.5);
  }
  
  .puzzle-cell.filled {
    border-style: solid;
    border-color: #00f0ff;
  }
  
  .puzzle-cell.correct {
    border-color: #00ff88;
    box-shadow: 0 0 15px rgba(0,255,136,0.5);
  }
  
  .puzzle-cell .piece {
    width: 100%;
    height: 100%;
    background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400"><rect fill="%23e0e0e0" width="400" height="400"/><rect fill="%23333" x="40" y="60" width="200" height="140" rx="8"/><rect fill="%23111" x="50" y="70" width="180" height="120"/><rect fill="%23555" x="130" y="200" width="20" height="30"/><rect fill="%23333" x="100" y="230" width="80" height="10" rx="3"/><rect fill="%23e0e0e0" x="280" y="60" width="80" height="200" rx="8"/><rect fill="%23ccc" x="290" y="70" width="60" height="15" rx="2"/><rect fill="%23ccc" x="290" y="95" width="60" height="15" rx="2"/><rect fill="%23ccc" x="290" y="120" width="60" height="15" rx="2"/><rect fill="%23aaa" x="290" y="150" width="60" height="100" rx="4"/><rect fill="%23666" x="310" y="180" width="20" height="20" rx="2"/><rect fill="%23e0e0e0" x="60" y="270" width="160" height="50" rx="5"/><rect fill="%23333" x="70" y="280" width="140" height="30" rx="3"/><rect fill="%23e0e0e0" x="250" y="290" width="40" height="30" rx="15"/></svg>');
    background-size: 300% 300%;
    border-radius: 8px;
  }
  
  /* PIECES POOL */
  .pieces-pool {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    max-width: 400px;
    margin: 0 auto;
  }
  
  .piece-item {
    aspect-ratio: 1;
    border: 2px solid rgba(255,0,229,0.5);
    border-radius: 10px;
    cursor: pointer;
    transition: all 0.3s;
    position: relative;
    overflow: hidden;
    background: rgba(255,0,229,0.1);
  }
  
  .piece-item:hover {
    transform: scale(1.05);
    border-color: #ff00e5;
    box-shadow: 0 0 20px rgba(255,0,229,0.5);
  }
  
  .piece-item.selected {
    border-color: #ffd700;
    box-shadow: 0 0 25px rgba(255,215,0,0.8);
    transform: scale(1.1);
  }
  
  .piece-item.placed {
    opacity: 0.3;
    pointer-events: none;
  }
  
  .piece-item .piece {
    width: 100%;
    height: 100%;
    background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400"><rect fill="%23e0e0e0" width="400" height="400"/><rect fill="%23333" x="40" y="60" width="200" height="140" rx="8"/><rect fill="%23111" x="50" y="70" width="180" height="120"/><rect fill="%23555" x="130" y="200" width="20" height="30"/><rect fill="%23333" x="100" y="230" width="80" height="10" rx="3"/><rect fill="%23e0e0e0" x="280" y="60" width="80" height="200" rx="8"/><rect fill="%23ccc" x="290" y="70" width="60" height="15" rx="2"/><rect fill="%23ccc" x="290" y="95" width="60" height="15" rx="2"/><rect fill="%23ccc" x="290" y="120" width="60" height="15" rx="2"/><rect fill="%23aaa" x="290" y="150" width="60" height="100" rx="4"/><rect fill="%23666" x="310" y="180" width="20" height="20" rx="2"/><rect fill="%23e0e0e0" x="60" y="270" width="160" height="50" rx="5"/><rect fill="%23333" x="70" y="280" width="140" height="30" rx="3"/><rect fill="%23e0e0e0" x="250" y="290" width="40" height="30" rx="15"/></svg>');
    background-size: 300% 300%;
    border-radius: 8px;
  }
  
  .piece-number {
    position: absolute;
    top: 5px;
    left: 5px;
    background: rgba(0,0,0,0.7);
    color: #00f0ff;
    width: 25px;
    height: 25px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Orbitron', sans-serif;
    font-size: 0.8rem;
    font-weight: 700;
  }
  
  /* CONTROLS */
  .controls {
    display: flex;
    justify-content: center;
    gap: 20px;
    flex-wrap: wrap;
  }
  
  .btn {
    font-family: 'Orbitron', sans-serif;
    padding: 15px 30px;
    border: none;
    border-radius: 50px;
    cursor: pointer;
    font-size: 1rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    transition: all 0.3s;
  }
  
  .btn-primary {
    background: linear-gradient(90deg, #00f0ff, #00cc6a);
    color: #0a0e27;
    box-shadow: 0 5px 20px rgba(0,240,255,0.4);
  }
  
  .btn-primary:hover {
    transform: translateY(-3px);
    box-shadow: 0 10px 30px rgba(0,240,255,0.6);
  }
  
  .btn-secondary {
    background: rgba(255,255,255,0.1);
    color: #fff;
    border: 2px solid rgba(255,255,255,0.3);
  }
  
  .btn-secondary:hover {
    background: rgba(255,255,255,0.2);
    border-color: #ff00e5;
  }
  
  /* MODAL */
  .modal {
    display: none;
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(0,0,0,0.9);
    z-index: 1000;
    justify-content: center;
    align-items: center;
    padding: 20px;
  }
  
  .modal.active {
    display: flex;
    animation: fadeIn 0.5s;
  }
  
  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }
  
  .modal-content {
    background: linear-gradient(135deg, #1a1f4e, #2d1b69);
    border: 3px solid #00f0ff;
    border-radius: 25px;
    padding: 40px;
    max-width: 500px;
    text-align: center;
    animation: slideUp 0.5s;
  }
  
  @keyframes slideUp {
    from { transform: translateY(50px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }
  
  .modal-icon {
    font-size: 5rem;
    margin-bottom: 20px;
    animation: bounce 1s infinite;
  }
  
  @keyframes bounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-20px); }
  }
  
  .modal-title {
    font-family: 'Orbitron', sans-serif;
    font-size: 2rem;
    color: #00f0ff;
    margin-bottom: 20px;
  }
  
  .modal-stats {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
    margin: 30px 0;
  }
  
  .modal-stat {
    background: rgba(0,240,255,0.1);
    border-radius: 10px;
    padding: 15px;
  }
  
  .modal-stat-label {
    font-size: 0.9rem;
    color: #b8bcff;
  }
  
  .modal-stat-value {
    font-family: 'Orbitron', sans-serif;
    font-size: 1.8rem;
    color: #ffd700;
    margin-top: 5px;
  }
  
  /* HINT */
  .hint-box {
    background: rgba(255,215,0,0.1);
    border: 2px solid #ffd700;
    border-radius: 15px;
    padding: 20px;
    margin-top: 20px;
    text-align: center;
  }
  
  .hint-title {
    color: #ffd700;
    font-family: 'Orbitron', sans-serif;
    margin-bottom: 10px;
  }
  
  .preview-image {
    max-width: 200px;
    margin: 10px auto;
    border-radius: 10px;
    border: 2px solid rgba(255,255,255,0.3);
  }
  
  /* PARTICLES */
  .particles {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: -1;
  }
  
  .particle {
    position: absolute;
    width: 4px; height: 4px;
    background: #00f0ff;
    border-radius: 50%;
    animation: float 15s infinite linear;
    box-shadow: 0 0 10px #00f0ff;
  }
  
  @keyframes float {
    0% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
    10% { opacity: 1; }
    90% { opacity: 1; }
    100% { transform: translateY(-10vh) rotate(720deg); opacity: 0; }
  }
</style>
</head>
<body>

<div class="particles" id="particles"></div>

<div class="container">
  <div class="header">
    <h1 class="title">🖥️ СОБЕРИ ПК</h1>
    <p class="subtitle">ПАЗЛ-ЧЕЛЛЕНДЖ • 9 ФРАГМЕНТОВ</p>
  </div>
  
  <div class="stats-bar">
    <div class="stat-card">
      <div class="stat-label">️ Время</div>
      <div class="stat-value timer" id="timer">00:00</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">🎯 Ходы</div>
      <div class="stat-value moves" id="moves">0</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">✅ Собрано</div>
      <div class="stat-value" id="progress">0/9</div>
    </div>
  </div>
  
  <div class="game-area">
    <div class="panel">
      <div class="panel-title">🎯 Поле сборки</div>
      <div class="puzzle-grid" id="puzzleGrid"></div>
    </div>
    
    <div class="panel">
      <div class="panel-title">🧩 Фрагменты</div>
      <div class="pieces-pool" id="piecesPool"></div>
    </div>
  </div>
  
  <div class="controls">
    <button class="btn btn-primary" onclick="startGame()">🚀 Новая игра</button>
    <button class="btn btn-secondary" onclick="showHint()">💡 Подсказка</button>
    <button class="btn btn-secondary" onclick="resetGame()">🔄 Сброс</button>
  </div>
  
  <div class="hint-box" id="hintBox" style="display: none;">
    <div class="hint-title">💡 ПОДСКАЗКА</div>
    <p>Собери настольный компьютер: монитор, системный блок, клавиатура и мышь</p>
  </div>
</div>

<!-- WIN MODAL -->
<div class="modal" id="winModal">
  <div class="modal-content">
    <div class="modal-icon">🏆</div>
    <h2 class="modal-title">ПОБЕДА!</h2>
    <p>Ты собрал компьютер!</p>
    <div class="modal-stats">
      <div class="modal-stat">
        <div class="modal-stat-label">Время</div>
        <div class="modal-stat-value" id="finalTime">00:00</div>
      </div>
      <div class="modal-stat">
        <div class="modal-stat-label">Ходы</div>
        <div class="modal-stat-value" id="finalMoves">0</div>
      </div>
    </div>
    <button class="btn btn-primary" onclick="closeModal(); startGame();">Играть снова</button>
  </div>
</div>

<script>
// GAME STATE
let selectedPiece = null;
let moves = 0;
let seconds = 0;
let timerInterval = null;
let placedPieces = new Set();
let gameStarted = false;

// PIECE POSITIONS (background-position for 3x3 grid)
const piecePositions = [
  { x: 0, y: 0 },      // 1 - top-left
  { x: 50, y: 0 },     // 2 - top-center
  { x: 100, y: 0 },    // 3 - top-right
  { x: 0, y: 50 },     // 4 - middle-left
  { x: 50, y: 50 },    // 5 - center
  { x: 100, y: 50 },   // 6 - middle-right
  { x: 0, y: 100 },    // 7 - bottom-left
  { x: 50, y: 100 },   // 8 - bottom-center
  { x: 100, y: 100 }   // 9 - bottom-right
];

// SHUFFLE
function shuffle(array) {
  const arr = [...array];
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

// CREATE PARTICLES
function createParticles() {
  const container = document.getElementById('particles');
  for (let i = 0; i < 25; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    p.style.left = Math.random() * 100 + '%';
    p.style.animationDelay = Math.random() * 15 + 's';
    p.style.animationDuration = (Math.random() * 10 + 10) + 's';
    if (Math.random() > 0.5) {
      p.style.background = '#ff00e5';
      p.style.boxShadow = '0 0 10px #ff00e5';
    }
    container.appendChild(p);
  }
}

// START GAME
function startGame() {
  moves = 0;
  seconds = 0;
  placedPieces.clear();
  selectedPiece = null;
  gameStarted = true;
  
  updateStats();
  startTimer();
  renderGrid();
  renderPieces();
}

// TIMER
function startTimer() {
  if (timerInterval) clearInterval(timerInterval);
  timerInterval = setInterval(() => {
    seconds++;
    const mins = Math.floor(seconds / 60).toString().padStart(2, '0');
    const secs = (seconds % 60).toString().padStart(2, '0');
    document.getElementById('timer').textContent = `${mins}:${secs}`;
  }, 1000);
}

// UPDATE STATS
function updateStats() {
  document.getElementById('moves').textContent = moves;
  document.getElementById('progress').textContent = `${placedPieces.size}/9`;
}

// RENDER GRID
function renderGrid() {
  const grid = document.getElementById('puzzleGrid');
  grid.innerHTML = '';
  
  for (let i = 0; i < 9; i++) {
    const cell = document.createElement('div');
    cell.className = 'puzzle-cell';
    cell.dataset.index = i;
    cell.onclick = () => handleCellClick(i);
    
    if (placedPieces.has(i)) {
      cell.classList.add('filled', 'correct');
      const piece = document.createElement('div');
      piece.className = 'piece';
      piece.style.backgroundPosition = `${piecePositions[i].x}% ${piecePositions[i].y}%`;
      cell.appendChild(piece);
    }
    
    grid.appendChild(cell);
  }
}

// RENDER PIECES
function renderPieces() {
  const pool = document.getElementById('piecesPool');
  pool.innerHTML = '';
  
  const shuffled = shuffle([0,1,2,3,4,5,6,7,8]);
  
  shuffled.forEach((pieceIndex, displayIndex) => {
    const item = document.createElement('div');
    item.className = 'piece-item';
    item.dataset.pieceIndex = pieceIndex;
    item.onclick = () => handlePieceClick(pieceIndex, item);
    
    if (placedPieces.has(pieceIndex)) {
      item.classList.add('placed');
    }
    
    if (selectedPiece === pieceIndex) {
      item.classList.add('selected');
    }
    
    const piece = document.createElement('div');
    piece.className = 'piece';
    piece.style.backgroundPosition = `${piecePositions[pieceIndex].x}% ${piecePositions[pieceIndex].y}%`;
    item.appendChild(piece);
    
    const num = document.createElement('div');
    num.className = 'piece-number';
    num.textContent = pieceIndex + 1;
    item.appendChild(num);
    
    pool.appendChild(item);
  });
}

// HANDLE PIECE CLICK
function handlePieceClick(pieceIndex, element) {
  if (placedPieces.has(pieceIndex)) return;
  
  if (selectedPiece === pieceIndex) {
    selectedPiece = null;
  } else {
    selectedPiece = pieceIndex;
  }
  
  renderPieces();
}

// HANDLE CELL CLICK
function handleCellClick(cellIndex) {
  if (!gameStarted) return;
  if (placedPieces.has(cellIndex)) return;
  if (selectedPiece === null) return;
  
  // Place piece
  placedPieces.add(selectedPiece);
  moves++;
  
  // Check if correct position
  if (selectedPiece === cellIndex) {
    // Correct!
  } else {
    // Wrong position - still place it but mark as wrong
    // For simplicity, we allow any placement
  }
  
  selectedPiece = null;
  updateStats();
  renderGrid();
  renderPieces();
  
  // Check win
  if (placedPieces.size === 9) {
    checkWin();
  }
}

// CHECK WIN
function checkWin() {
  clearInterval(timerInterval);
  
  let allCorrect = true;
  for (let i = 0; i < 9; i++) {
    if (!placedPieces.has(i)) {
      allCorrect = false;
      break;
    }
  }
  
  if (allCorrect) {
    setTimeout(() => {
      const mins = Math.floor(seconds / 60).toString().padStart(2, '0');
      const secs = (seconds % 60).toString().padStart(2, '0');
      document.getElementById('finalTime').textContent = `${mins}:${secs}`;
      document.getElementById('finalMoves').textContent = moves;
      document.getElementById('winModal').classList.add('active');
    }, 500);
  }
}

// SHOW HINT
function showHint() {
  const hint = document.getElementById('hintBox');
  hint.style.display = hint.style.display === 'none' ? 'block' : 'none';
}

// RESET GAME
function resetGame() {
  placedPieces.clear();
  selectedPiece = null;
  moves = 0;
  updateStats();
  renderGrid();
  renderPieces();
}

// CLOSE MODAL
function closeModal() {
  document.getElementById('winModal').classList.remove('active');
}

// INIT
createParticles();
renderGrid();
renderPieces();
</script>

</body>
</html>
